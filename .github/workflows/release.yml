name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Linux Packages (.deb, AppImage, tar.gz)
  # ============================================================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 portaudio19-dev libnotify-bin xclip xdotool file curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller packaging/freeflow.spec --distpath dist --workpath build -y

      - name: Generate Debian Package (.deb)
        run: |
          chmod +x packaging/build_deb.sh
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          [ -z "$RELEASE_VER" ] && RELEASE_VER="${{ github.event.inputs.tag_name }}"
          RELEASE_VER="${RELEASE_VER#v}"
          ./packaging/build_deb.sh "${RELEASE_VER:-1.2.1}"

      - name: Generate AppImage & Portable Tarball
        run: |
          chmod +x packaging/build_appimage.sh
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          [ -z "$RELEASE_VER" ] && RELEASE_VER="${{ github.event.inputs.tag_name }}"
          RELEASE_VER="${RELEASE_VER#v}"
          ./packaging/build_appimage.sh "${RELEASE_VER:-1.2.1}"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz

  # ============================================================================
  # 2. Windows Packages (x64 Standalone Exe + Inno Setup Installer)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller packaging/freeflow.spec --distpath dist --workpath build -y

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\freeflow.iss

      - name: Create Portable Zip
        run: |
          Compress-Archive -Path dist\freeflow\* -DestinationPath dist\FreeFlow-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.zip

  # ============================================================================
  # 3. macOS Packages (Universal DMG & App Bundle)
  # ============================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          brew install portaudio ffmpeg || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller packaging/freeflow.spec --distpath dist --workpath build -y

      - name: Package macOS DMG
        run: |
          chmod +x packaging/macos/build_dmg.sh
          RELEASE_VER="${GITHUB_REF_NAME#v}"
          [ -z "$RELEASE_VER" ] && RELEASE_VER="${{ github.event.inputs.tag_name }}"
          RELEASE_VER="${RELEASE_VER#v}"
          ./packaging/macos/build_dmg.sh "${RELEASE_VER:-1.2.1}"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.dmg
            dist/*.tar.gz

  # ============================================================================
  # 4. Publish Release to GitHub
  # ============================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Create Release Directory
        run: mkdir -p release_assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release_assets/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_assets/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release_assets/

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: FreeFlow ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*
